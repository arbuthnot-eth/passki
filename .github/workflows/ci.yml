name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      # Gate on critical advisories. Lower severities are tracked by
      # Dependabot; most sit in dev-only tooling (wrangler, vite).
      - name: Dependency audit
        run: bun audit --audit-level=critical

      - name: Test
        run: bun test

      # Includes scripts/check-no-private-keys.mjs, so a key-shaped variable
      # added to Worker config fails CI too.
      - name: Build
        run: bun run build

      # Non-blocking for now: the codebase has a backlog of type errors.
      # Reported so the count is visible and can be ratcheted down.
      - name: Typecheck (report only)
        continue-on-error: true
        run: |
          set +e
          npx tsc --noEmit -p . > tsc.log 2>&1
          COUNT=$(grep -c 'error TS' tsc.log)
          echo "TypeScript errors: $COUNT"
          echo "### TypeScript errors: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          exit 0
